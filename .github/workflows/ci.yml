name: CI

on:
  push:
    # This repo's mainline is `dev` (`stable` is the reserved release
    # branch). The filter previously named `main`, a branch this repo does
    # not have, so no mainline push ever triggered this workflow.
    branches: [dev, stable]
  pull_request:
    branches-ignore: [agents]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (nix dev shell)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      # Installs Nix and clones the siblings in .github/sibling-repos
      # (codetracer-trace-format, codetracer-trace-format-nim) to ../<name>
      # at the revisions this commit's repro.lock pins. The crate cannot build
      # without them (Cargo.toml path dependencies, and the Nim FFI sources
      # codetracer_trace_writer_nim's build script compiles), and the lock is
      # the only record of which revision this commit builds against.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
      - name: Run tests
        # The pipe used to live inside `bash -c '...'`. A bare `bash -c` has
        # neither errexit nor pipefail, so `just test | tee` took tee's exit
        # status, `bash -c` exited 0, `nix develop` propagated that 0, and a
        # failing suite was reported as a passing job. `shell: bash` alone does
        # NOT fix that -- the masking pipe is one shell deeper. Lift the pipe
        # into the step shell, which `shell: bash` runs with
        # `--noprofile --norc -eo pipefail`.
        # `mkdir` also moves out of the nix shell, so `logs/` exists for the
        # upload step even when `nix develop` itself fails.
        shell: bash
        run: |
          mkdir -p logs
          dev-exec just test 2>&1 | tee logs/test.log
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 1

      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: logs/
          prefix: test-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  lint:
    name: lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      # Installs Nix and clones the lock-pinned siblings; see the `test` job.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
      - name: Run lint
        # See the note on `Run tests`: the masking pipe was inside `bash -c`.
        shell: bash
        run: |
          mkdir -p logs
          dev-exec just lint 2>&1 | tee logs/lint.log
      - name: Verify ecosystem-matrix toolchains
        # Evaluates every `ecosystem-matrix` leg's toolchain from flake.lock
        # and checks it is the OTP/Elixir the leg names, so a leg that cannot
        # start (as OTP 26 could not once nixpkgs removed `erlang_26`) fails
        # here with the reason instead of in a `nix shell` deep in the leg.
        # It needs nix and the network, so it is not part of `just lint`.
        shell: bash
        run: |
          dev-exec just verify-ecosystem-matrix-toolchains 2>&1 | tee logs/ecosystem-matrix-toolchains.log
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs
          path: logs/
          retention-days: 1

      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: logs/
          prefix: lint-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  nix-build:
    name: nix-build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      # Installs Nix and clones the lock-pinned siblings; see the `test` job.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
      - name: Build default package
        # Here the pipe is at the step level, so `shell: bash` is enough: it
        # selects `bash --noprofile --norc -eo pipefail` instead of the default
        # `bash -e` (errexit, but NO pipefail).
        #
        # The overrides are what make this build the trace-format revisions
        # repro.lock pins: setup-dev-env cloned exactly those to ../, and
        # without the overrides the flake would fall back to the revisions
        # flake.lock records for its own inputs, which nothing keeps in step
        # with repro.lock.
        shell: bash
        run: |
          mkdir -p logs
          nix build .#default --print-build-logs \
            --override-input codetracer-trace-format path:../codetracer-trace-format \
            --override-input codetracer-trace-format-nim path:../codetracer-trace-format-nim \
            2>&1 | tee logs/nix-build.log
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-logs
          path: logs/
          retention-days: 1

      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: logs/
          prefix: nix-build-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  release-check:
    name: release-check
    runs-on: [self-hosted, linux, x64]
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      # Installs Nix and clones the lock-pinned siblings; see the `test` job.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
      - name: Run release-check
        # See the note on `Run tests`: the masking pipe was inside `bash -c`.
        shell: bash
        run: |
          mkdir -p logs
          dev-exec just release-check 2>&1 | tee logs/release-check.log
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-logs
          path: logs/
          retention-days: 1

      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: logs/
          prefix: release-check-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  # M17 OTP/Elixir compatibility matrix. Runs the recorder integration
  # suite under each supported (OTP, Elixir) pair against the OS-provided
  # toolchain (no Nix dev shell). The Nix dev shell remains the canonical
  # build environment (`test`, `lint`, `nix-build`, `release-check`); the
  # matrix below confirms the recorder also runs under upstream Hex /
  # Erlang Solutions toolchains so a Hex consumer is not surprised.
  #
  # Matrix selection rationale:
  #   * OTP 26 + Elixir 1.16 — the floor we ship Hex package metadata
  #     for (mix.exs declares `elixir: "~> 1.15"` and Elixir 1.15 was
  #     EOL'd before this milestone; 1.16 is the practical floor).
  #   * OTP 27 + Elixir 1.17 — current stable upstream pair.
  #
  # macOS coverage is documented in CHANGELOG.md as deferred follow-up;
  # the GitHub-hosted macOS runners require erlang-via-Homebrew bring-up
  # that is out of scope for the M17 release-hardening cut. The Linux
  # matrix below is the v1 ecosystem coverage baseline.
  ecosystem-matrix:
    name: matrix (otp ${{ matrix.otp }} / elixir ${{ matrix.elixir }})
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        # Each leg pins its (OTP, Elixir) pair via nixpkgs beam package
        # sets instead of the GitHub-hosted erlef/setup-beam (which cannot
        # run on the self-hosted NixOS eph-linux-x64 runner). Each attr is
        # `<flake input>#<attr>`, resolved through this repo's flake.lock
        # (`--inputs-from .` below), never through the runner's registry.
        # nixpkgs removed `erlang_26` as end-of-life after 25.11, so the
        # OTP 26 floor comes from the `nixpkgs-otp26` input, which flake.nix
        # pins to nixos-25.11. Elixir versions match exactly; nixpkgs only
        # exposes major-version erlang attrs, so OTP tracks the latest patch
        # of that major:
        #   * erlang_26 -> 26.2.5.x  (matches the intended OTP 26.2 line)
        #   * erlang_27 -> 27.3.x    (drift: intended 27.1, nearest is 27.3)
        # tests/verify-ecosystem-matrix-toolchains.sh evaluates every leg.
        include:
          - otp: "26.2"
            elixir: "1.16.3"
            erlang-attr: "nixpkgs-otp26#beam.packages.erlang_26.erlang"
            elixir-attr: "nixpkgs-otp26#beam.packages.erlang_26.elixir_1_16"
            rebar3-attr: "nixpkgs-otp26#beam.packages.erlang_26.rebar3"
          - otp: "27.1"
            elixir: "1.17.3"
            erlang-attr: "nixpkgs#beam.packages.erlang_27.erlang"
            elixir-attr: "nixpkgs#beam.packages.erlang_27.elixir_1_17"
            rebar3-attr: "nixpkgs#beam.packages.erlang_27.rebar3"
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      # This leg deliberately avoids the dev shell, so it takes the siblings
      # from clone-siblings directly rather than through setup-dev-env: the
      # same lock-pinned revisions, to ../<name>, with no Nix env attached.
      - name: Clone lock-pinned siblings
        uses: metacraft-labs/metacraft-github-actions/clone-siblings@dev
        with:
          gh-token: ${{ steps.app-token.outputs.token }}
      # `[self-hosted, linux, x64]` also matches garm-* ephemeral runners,
      # whose job PATH carries no `nix` until it is provisioned ("nix: command
      # not found" on every leg that landed there). The shared setup-nix
      # action makes the `nix shell` below work on every runner class.
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
      - name: Build + test under OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }} (nixpkgs toolchain)
        # nixpkgs provides the whole toolchain the GitHub-hosted actions
        # (setup-beam / setup-rust-toolchain / setup-just) and apt-get used
        # to install, so the leg runs on the NixOS runner. hex + rebar are
        # installed the way setup-beam did by default.
        #
        # nim + nimble: codetracer_trace_writer_nim's build script compiles
        # the Nim FFI library from ../codetracer-trace-format-nim. rebar3:
        # `just build` compiles rebar3_codetracer. Without all three `just
        # build` saw no nimble and re-ran itself inside `nix develop`, i.e. on
        # the dev shell's OTP rather than this leg's, and `just
        # test-integration` could not build the crate at all.
        #
        # gcc: rustc links through `cc`, which `nix shell` (unlike a dev
        # shell, whose stdenv brings one) does not provide, and a NixOS
        # runner has none on its PATH ("error: linker `cc` not found").
        #
        # `--inputs-from .` makes every `<name>#` below this repo's
        # flake.lock input of that name, so the leg builds the same toolchain
        # on every runner. Without it `nixpkgs#` was each host's registry
        # entry: an unpinned nixpkgs, which on 2026-10-21 no longer had
        # `erlang_26` and stopped the OTP 26 leg at evaluation.
        run: |
          nix shell --inputs-from . \
            "${{ matrix.erlang-attr }}" \
            "${{ matrix.elixir-attr }}" \
            "${{ matrix.rebar3-attr }}" \
            nixpkgs#rustc nixpkgs#cargo nixpkgs#clippy nixpkgs#rustfmt nixpkgs#gcc \
            nixpkgs#just nixpkgs#zstd nixpkgs#capnproto nixpkgs#pkg-config \
            nixpkgs#nim nixpkgs#nimble \
            nixpkgs#jq nixpkgs#shellcheck \
            -c bash -c '
              mix local.hex --force
              mix local.rebar --force
              just build
              just test-integration
            '
      - name: Upload matrix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-logs-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}
          path: |
            target/debug/codetracer-beam-recorder
            tests/
