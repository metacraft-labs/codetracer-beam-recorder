# =============================================================================
# Recorder -> launcher end-to-end compatibility gate (THE RECORDER EDGE).
#
# THIN CALLER.  All of the work -- building the real launcher, the real
# codetracer desktop core and THIS recorder, staging the codetracer-desktop
# component bundle, running `ct record` through the LAUNCHER binary and decoding
# the produced trace with `ct-print` -- lives in one reusable workflow so the
# assertions can never drift between the trigger directions:
#
#   metacraft-labs/codetracer/.github/workflows/launcher-recorder-e2e.yml
#
# Design: three trigger edges (desktop core, launcher, each recorder) share
# one reusable workflow, so every edge runs the same assertions.
#
# WHY THIS EDGE IN PARTICULAR.  The beam edge is the standing proof of a bug
# this initiative caught and fixed: `ct record foo.ex` reaches this recorder as
# `codetracer-beam-recorder record ... -- elixir <program>` (and `-- escript`
# for `.erl`), but `is_beam_target()` once accepted only `mix`/`erl`/`rebar3`,
# so `ct record foo.ex` exited 0 having written a 2-event, 0-function
# "mode": "non_beam" trace -- a SILENT non-recording no `ct --version` smoke
# test could ever notice.  The recorder gained real `elixir`/`escript` launch
# targets (docs/launch-targets.md); this gate is what keeps that honest, in
# both directions.
#
# WHAT THIS EDGE PINS.  This repository is the one under test, so it is pinned
# to `github.sha` -- and this caller does not have to say so.  The reusable
# workflow makes the TRIGGERING repo its primary `actions/checkout` at
# `${{ github.sha }}`; inside a reusable workflow that context is the caller's.
# The launcher, the desktop core, its agent-surface build-deps and
# codetracer-trace-format-nim are cloned beside it at the revisions this
# commit's own committed `repro.lock` pins.
#
# LOCK STATUS.  A sibling this commit's `repro.lock` does not pin leaves this
# edge failing in `Setup dev env`.  The remedy is to refresh the lock from a
# workspace whose sibling checkouts are current (`repro ws lock`, which the
# pre-push hook also runs) and commit it; a lock refreshed from stale
# agent-surface checkouts pins a nim-agents that predates `loadSession`, and
# codetracer's sibling-override build then fails.  Do NOT paper over a missing
# pin with a `<name>=<ref>` sibling override.
#
# WHAT IT ASSERTS ABOUT THIS REPO.  Everything comes from this repo's own
# checked-in contract fixture, `cross-repo/launcher-compat.yml`: the sample
# program, the `record .ex` route, the recorder flags the desktop core passes
# (`--out-dir` / `--source-dir`), and the expected decoded-trace shape.  If this
# recorder changes its CLI, its launch-target detection, its output layout or
# its `--version` banner, that file has to change in the SAME commit -- the
# driver refuses to run against a fixture that disagrees with it, and rejects an
# INCOMPLETE fixture before anything is built.
#
# WHY IT IS NOT `launcher-integration.yml`.  That workflow is retained as a fast
# pre-check, but it asserts only that `ct --version` matches
# `^ct [0-9]+\.[0-9]+` and never runs `ct record`, so it is NON-AUTHORITATIVE
# for the record contract.  This gate is the authority.
#
# NO PATH FILTERS, deliberately: a change anywhere in this recorder can break
# the record contract.
# =============================================================================

name: launcher-recorder-e2e

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches-ignore: [agents]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: beam
    uses: metacraft-labs/codetracer/.github/workflows/launcher-recorder-e2e.yml@dev
    with:
      edge: codetracer-beam-recorder@${{ github.sha }} -> launcher
      recorder-repo: codetracer-beam-recorder
      recorder-lang: beam
    # `inherit` rather than a named list: the CI Token Provider App ID is held
    # as a repository SECRET here and as a repository VARIABLE elsewhere in the
    # org, and the reusable workflow accepts either.
    secrets: inherit
